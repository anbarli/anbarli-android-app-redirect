name: Bug report
description: Report a problem with the Android app redirect banner.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Tap...
        3. See...
    validations:
      required: true
  - type: input
    id: wordpress
    attributes:
      label: WordPress version
      placeholder: "6.6"
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.2"
  - type: input
    id: browser
    attributes:
      label: Android browser
      placeholder: "Chrome 128, Samsung Internet, Firefox Android..."
  - type: dropdown
    id: app-links
    attributes:
      label: Are Android App Links verified?
      options:
        - "Yes"
        - "No"
        - "Not sure"
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add screenshots, logs, or relevant configuration details.
